{{ define "title" }}
  {{ .Title }} · {{ site.Title }}
{{ end }}
{{ define "content" }}
    <div id="posts-wrap" class="wrap single">
        <ul id="posts" class="show">
          {{ partial "page.html" . }}
        </ul>
        {{ if not .Params.metaPage }}
            <div class="pagination" id="pagination-posts">
              <div class="pagination-links">
                {{with .Prev}}
                  <a class="pagination-newer" href="{{.Permalink}}" aria-label="{{ i18n "previous_page" }}">◀</a>
                {{end}}
                {{with .Next}}
                    <a class="pagination-older" href="{{.Permalink}}" aria-label="{{ i18n "next_page" }}">▶</a>
                {{end}}
              </div>
            </div>
        {{ end }}
    </div>
{{ end }}
